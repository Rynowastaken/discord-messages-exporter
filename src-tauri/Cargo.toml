[package]
name = "discord-messages-exporter-desktop"
version = "0.1.0"
description = "Desktop shell for the Discord Messages Exporter console"
authors = ["Rynowastaken"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
