name: Release notes

on:
  workflow_run:
    workflows: ["Desktop release"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply-changelog:
    name: Apply changelog
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Replace generated notes with the release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -f "docs/releases/$TAG.md" ]; then
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
          else
            echo "No changelog file for $TAG; keeping generated notes."
          fi
