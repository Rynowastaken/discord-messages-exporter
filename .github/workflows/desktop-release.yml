name: Desktop release

# Release asset names must always include the platform:
# Windows_x64_Portable, Linux_x86_64, and so on.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Build Linux installers
        run: npm run desktop:build

      - name: Rename Linux bundles with the platform
        run: |
          version=$(node -p "require('./package.json').version")
          shopt -s nullglob
          for file in src-tauri/target/release/bundle/deb/*.deb; do
            mv "$file" "src-tauri/target/release/bundle/deb/Discord-Messages-Exporter_${version}_Linux_x86_64.deb"
          done
          for file in src-tauri/target/release/bundle/rpm/*.rpm; do
            mv "$file" "src-tauri/target/release/bundle/rpm/Discord-Messages-Exporter_${version}_Linux_x86_64.rpm"
          done
          for file in src-tauri/target/release/bundle/appimage/*.AppImage; do
            mv "$file" "src-tauri/target/release/bundle/appimage/Discord-Messages-Exporter_${version}_Linux_x86_64.AppImage"
          done

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Build Windows binary
        run: npx tauri build --no-bundle

      - name: Build Windows server executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin discord-messages-exporter-server

      - name: Assemble portable Windows folder
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $root = "dist-portable"
          $app = "$root/Discord Messages Exporter"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "src-tauri/target/release/discord-messages-exporter-desktop.exe" "$app/Discord Messages Exporter.exe"
          Copy-Item "src-tauri/target/release/discord-messages-exporter-server.exe" "$app/Discord Messages Exporter Server.exe"
          Copy-Item "src-tauri/resources/app" "$app/app" -Recurse
          Copy-Item "README.md" "$app/README.md"
          @"
          Discord Messages Exporter $version — portable Windows build

          Desktop app:
            Run "Discord Messages Exporter.exe".

          LAN server:
            Run "Start Server.cmd" (or "Discord Messages Exporter Server.exe").
            It prints the local and network URLs and keeps running until Ctrl-C.
            Data and the URL file are written under %APPDATA%\discord-messages-exporter
            unless you pass --data <folder>.

          The desktop shell needs Microsoft Edge WebView2, which is included
          with current Windows 10 and Windows 11 installations.
          "@ | Set-Content "$app/README.txt"
          @"
          @echo off
          cd /d "%~dp0"
          "Discord Messages Exporter Server.exe" --host 0.0.0.0 --port 8788
          pause
          "@ | Set-Content "$app/Start Server.cmd"
          Compress-Archive -Path "$app/*" -DestinationPath "$root/Discord-Messages-Exporter_${version}_Windows_x64_Portable.zip" -Force

      - name: Upload portable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          if-no-files-found: error
          path: dist-portable/*.zip

  release:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Discord Messages Exporter ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
